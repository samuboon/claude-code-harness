# Check the quotations in your reports against the source pages you saved beside them.
# Copy it to `.github/workflows/quote-check.yml` and point the paths at your own tree; the
# last two steps only make sense inside this repository.
#
# It lives here rather than under `.github/` because the token this repository is
# published with has no `workflow` scope. That is a local accident, not advice.
name: quote-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Substantive differences and quotes found in no saved source fail the build.
      # Formatting differences are printed and pass. Add --strict once your tree is
      # clean of them; starting strict on an existing tree only teaches people to
      # ignore a red build.
      - name: Check quotations against the saved sources
        run: python3 quote-check/quote_check.py quote-check/demo/report.md --sources quote-check/demo/pages
        continue-on-error: true   # the demo report is wrong on purpose

      - name: Tests (42)
        run: python3 -m unittest discover -s quote-check -t quote-check -p 'test_quote_check.py'

      - name: Mutation check (25 deliberate breakages, all must be caught)
        run: python3 quote-check/mutation_check.py
